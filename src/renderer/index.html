<!DOCTYPE html>
<!-- 対比の最小: 文字 8.56:1（注釈 #434d5b とカードの面 #ffffff・標準の配色）、線 3.76:1（罫線 #78818f と地 #f8fafc・標準の配色）。標準・高コントラスト（白地）・高コントラスト（黒地）の三つの配色の、フォーカス中の項目と選ばれているボタンを含む全部の組み合わせで、2026-11-03 に WCAG の式で計算（小数2桁で切り捨て・test/settings.test.js が測る）。配色は基のカード型ページの値。 -->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';">
  <title>Todoku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="main">
    <h1 id="page-title">Todoku</h1>
    <div id="deck">
      <p id="loading">設定ファイルを読んでいます。</p>
    </div>
  </main>
  <!-- 読み上げに知らせる所。見える欄は置かない。ふつうの知らせと、強い知らせを分ける。 -->
  <div id="status" role="status" aria-live="polite" class="visually-hidden"></div>
  <div id="alert" role="alert" aria-live="assertive" class="visually-hidden"></div>
  <script src="renderer.js"></script>
</body>
</html>
