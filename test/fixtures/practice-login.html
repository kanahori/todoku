<!DOCTYPE html>
<!-- 作り物の練習のページ（ログインの画面）。送り先は無く、どこにも送らない。 -->
<!-- 対比の最小: 文字 21:1（#000000 と #ffffff）。 -->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>ログイン（作り物）</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #000000; background: #ffffff; margin: 1rem 2rem; }
  </style>
</head>
<body>
  <main>
    <h1>ログイン</h1>
    <form id="login" action="#">
      <p><label>ユーザー名 <input type="text" name="username" autocomplete="off"></label></p>
      <p><label>パスワード <input type="password" name="password" autocomplete="off"></label></p>
      <p><button type="submit">ログイン</button></p>
    </form>
  </main>
</body>
</html>
