<!DOCTYPE html>
<!-- 作り物の練習のページ（架空の「あおば町」）。項目の中で画像の説明（alt）と文字が重なるときに、一度だけ読むかの試し。 -->
<!-- 対比の最小: 文字 21:1（#ffffff と #000）。2026-11-04 に WCAG の式で計算。 -->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>あおば町のリンク集（作り物）</title>
  <style>body { color: #000; background: #ffffff; }</style>
</head>
<body>
  <main>
    <h1>リンク集（作り物）</h1>
    <ul id="links">
      <!-- 飾りの語（ロゴ）を外すと、画像の説明が文字に含まれる -->
      <li><a href="#map"><img alt="あおばマップのロゴ" src="map.png"> あおば町の地図のサイト「あおばマップ」</a></li>
      <!-- 1字だけ違う同じ長さの文 -->
      <li><a href="#study"><img alt="こども学習の支援サイト「まなび」" src="study.png"> こども学習を支援サイト「まなび」</a></li>
      <!-- 画像の説明が文字に含まれる -->
      <li><a href="#lib"><img alt="図書館" src="lib.png"> 図書館の開館日</a></li>
      <!-- 文字が画像の説明に含まれる（画像の説明の方を残す） -->
      <li><a href="#bus"><img alt="あおば町の路線バスの時刻表" src="bus.png"></a> <a href="#bus2">時刻表</a></li>
      <!-- 全角と半角・大文字と小文字をそろえても2字だけ違う文は、文字の方だけを読む -->
      <li><a href="#steam"><img alt="探求学習の支援サイト「ＳＴＥＡＭ まなび」" src="steam.png"> 探究学習の支援サイト「steam まなび」</a></li>
      <!-- 一つの名前が二つの要素に分かれているときは、読点で区切らない -->
      <li><a href="#care"><span style="display: block">あおば町在宅医療・</span><span style="display: block">介護連携の事業</span></a></li>
      <li><a href="#open"><span style="display: block">AOBA</span><span style="display: block">OPEN DATA</span></a></li>
      <!-- 違う中身は両方読む -->
      <li><a href="#pool"><img alt="町民プール" src="pool.png"> 夏の行事</a></li>
    </ul>
  </main>
</body>
</html>
